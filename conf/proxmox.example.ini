; Proxmox VE: the API token core drives the hypervisor with, and the node layout capricorn
; set up. Copy to conf/proxmox.ini (gitignored). Values MUST be quoted: a token id contains
; "!", which is reserved in INI.

[proxmox]
host     = "203.0.113.10"
tokenid  = "tiknix@pve!deploy"
secret   = "…"
node     = "pve"

; What a tenant container is made from and where it sits. Every value is required — TenantHost
; refuses to create a container without it, because no default could be right for another node.
[tenant]
os_template = "local:vztmpl/ubuntu-24.04-standard_24.04-2_amd64.tar.zst"
storage     = "local-lvm"
rootfs_gb   = 4
memory_mb   = 1024
swap_mb     = 512
cores       = 2
bridge      = "vmbr1"
subnet      = "10.10.10."
gateway     = "10.10.10.1"
dns         = "8.8.8.8"
key         = "/home/ubuntu/.ssh/tiknix_tenant_ed25519"
known_hosts = "/home/ubuntu/.ssh/known_hosts_tenants"

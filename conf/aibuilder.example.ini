; AI Builder configuration template. Copy to conf/aibuilder.ini and fill in the
; [token] secret, which MUST equal AIBUILDER_TOKEN_SECRET in both bridge env files
; (aibuilder-terminal and aibuilder-chat) so tokens minted here validate there.
; conf/aibuilder.ini is gitignored; this .example file is committed.

[token]
secret = change-me-to-a-long-random-string-shared-with-the-bridges
; session token lifetime (seconds)
ttl = 120

[bridge]
; Same-origin WebSocket paths (nginx proxies these to the bridges).
;   terminal: wss://<host>/aibuilder/ws       -> 127.0.0.1:3990 (node PTY bridge)
;   chat:     wss://<host>/aibuilder/chat-ws   -> 127.0.0.1:3991 (php ratchet bridge)
ws_path = /aibuilder/ws
chat_ws_path = /aibuilder/chat-ws

[access]
; Minimum role level allowed to REACH the AI Builder (lower = more privileged).
; 100 = MEMBER — members can use instances shared with their team; per-instance
; access is still enforced per endpoint. Provisioning (create) is ADMIN-only regardless.
min_level = 100

[ops]
; Directory holding the capricorn instance scripts (provision/snapshot/rollback).
bin_dir = /home/ubuntu/capricorn/bin
; Optional prefix if the fpm user needs elevation (e.g. "sudo -n ").
sudo_prefix =

[tools]
; Host path to the Mantic.sh MCP server (PHP AST analysis) wired into each
; workspace .mcp.json. Per-host — leave empty/absent to skip wiring mantic.
mantic_server =

[engine]
; Default coding agent for a freshly provisioned instance. Value is any registered
; [engine.*] name below. Resolution goes through lib/EngineRegistry (AGENT_ORCHESTRATION.md §7).
default = claude

[engine.claude]
label = Claude Code
transport = cli-headless
command = claude
cli_flavor = claude
headless_ready = true
planner_model = opus
worker_model = sonnet
auditor_model = sonnet
resolver_model = opus

[engine.qwen]
label = qwen-code
transport = cli-headless
command = qwen
cli_flavor = openai
openai_base_url = https://ollama.com/v1
openai_model = qwen3-coder:480b-cloud
; headless_ready = true   ; flip once jail-run.sh dispatches `qwen -p` (Phase A)
planner_model = opus
worker_model = qwen3-coder:480b-cloud
auditor_model = sonnet

[engine.kimi]
; Kimi Code CLI (MoonshotAI). Binary `kimi`, headless via `kimi -p`. Auth: /login or
; KIMI_API_KEY. Coding models K2.7 Code / K3. Falls back to claude until the jail
; launcher + `kimi` flavor are wired (Phase A); tiers stay claude-valid until then.
label = Kimi Code
available = false   ; closed beta — hidden from menus until we have access + a launcher
transport = cli-headless
command = kimi
cli_flavor = kimi
; headless_ready = true
planner_model = opus
worker_model = sonnet
auditor_model = sonnet
resolver_model = opus

[audit]
; Definition-of-Done QA pass after a plan completes: a jailed Playwright agent
; drives the live site as ROOT/ADMIN/MEMBER test users, screenshots the new
; interactions, posts results onto each subtask, reports failures to the firehose,
; and emails proof-of-life to the owner + shared teams. Set false to disable.
enabled = true

[plan]
; ONE automatic re-plan when a plan finishes with subtasks that did not land. By then the
; mechanical retries are exhausted, so the failure is a plan that was wrong, not a flake:
; the original goal goes back to the planner with the failures as context. Bounded to a
; single attempt by a link on the new plan (replan_of) — a re-plan never triggers another.
; Costs a frontier planner run when it fires. false = always escalate to the human.
auto_replan = true

[agent]
; Where agent credentials live — per MEMBER, not per project, so you sign in once and
; every project you can reach runs as you. Outside the instance dirs: those get archived
; on delete and shipped by the publish drivers.
state_base = /home/ubuntu/.tiknix/agent-state

[engine.zai]
; GLM via z.ai — an ANTHROPIC-COMPATIBLE endpoint, so this is not a new CLI. It is the
; Claude Code binary pointed somewhere else, which is why command/cli_flavor stay `claude`
; and headless works from day one: `claude -p` does not care whose API answers.
;
; jail-run.sh gives every engine its own state dir (.aibuilder/state/<engine>), so a
; project can hold a z.ai login and an Anthropic login at once without either clobbering
; the other's credentials.
label = "GLM (z.ai)"
transport = cli-headless
command = claude
cli_flavor = claude
headless_ready = true

; https://docs.z.ai/devpack/tool/claude — NOT /v1. The Anthropic-compatible surface lives
; under /api/anthropic, and z.ai authenticates with ANTHROPIC_AUTH_TOKEN rather than
; ANTHROPIC_API_KEY. Getting either wrong looks like an auth failure from Anthropic.
anthropic_base_url = https://api.z.ai/api/anthropic

; The KEY IS NOT STORED HERE. Same rule as [engine.qwen]: conf carries the non-secret
; wiring, the operator environment carries the credential, so provisioning an instance
; never copies somebody's API key into it. jail-run.sh reads this variable from its own
; environment and passes it in as ANTHROPIC_AUTH_TOKEN.
auth_token_env = ZAI_API_KEY

; Tier -> model. z.ai maps its own ids onto Claude's tier names, so the CLI keeps asking
; for "opus"/"sonnet"/"haiku" and z.ai answers with GLM.
planner_model  = glm-5.3
worker_model   = glm-5.3
auditor_model  = glm-5.3
resolver_model = glm-5.3
haiku_model    = glm-5.3-flash

; z.ai's own recommendation. GLM can sit well past Claude's default before first token,
; and a timeout mid-plan looks like the agent stalling rather than the request being cut.
api_timeout_ms = 3000000

; Flip to true once ZAI_API_KEY is in the operator environment and one task has run
; end to end. Hidden until then, so nobody selects an engine that cannot authenticate.
available = false

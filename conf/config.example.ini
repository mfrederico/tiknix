; TikNix Framework Configuration
; Copy this file to config.ini and update with your settings

[app]
name = "TikNix Application"
environment = "development" ; production, development, testing
debug = true
build_mode = true ; Enable to auto-create permissions (disable in production!)
session_name = "APP_SESSION"
session_lifetime = 86400 ; 24 hours
baseurl = "http://localhost:8000"
timezone = "UTC"
demo_mode = false ; ON: comms builds threads in-app and never calls Mailgun (offline demos/tests)
; Builder tooling (AI Builder, Workbench, Agent Setup) — control-plane-only.
; Leave unset on the root: it auto-detects by host (builds only on the apex,
; control_plane_host below / default <app>.com). Set false on a provisioned
; sub-instance to hard-disable the tools there regardless of host.
;builder_tools_enabled = false
;control_plane_host = "tiknix.com" ; apex host that counts as the control plane

[database]
type = "mysql" ; mysql, pgsql, sqlite
host = "localhost"
port = 3306
name = "tiknix"
user = "tiknix"
pass = "your_password_here"
charset = "utf8mb4"

[logging]
level = "DEBUG" ; DEBUG, INFO, WARNING, ERROR, CRITICAL
file = "log/app.log"
max_files = 30 ; Keep 30 days of logs

; Per-query cache tracing (hit/miss/invalidate). OFF by default: it accounted for 56% of
; a day's log lines while the cache was working correctly, which buries the errors that
; matter. Turn on only while debugging the query cache.
query_cache_debug = false

[mail]
enabled = false
driver = "smtp" ; smtp, mailgun, sendgrid
from_email = "noreply@example.com"
from_name = "My Application"

; SMTP Settings
smtp_host = "smtp.gmail.com"
smtp_port = 587
smtp_encryption = "tls" ; tls, ssl
smtp_username = ""
smtp_password = ""

; Mailgun / comms: credentials live in conf/mailgun.ini (key, domain, fromEmail,
; fromName, and optional signingKey, inboundDomain, endpoint) — shared by
; lib/Mailer and the comms subsystem. Not configured here.

[cors]
enabled = false
origin = "*"
methods = "GET, POST, PUT, DELETE, OPTIONS"
headers = "Content-Type, Authorization"
credentials = false

[security]
app_key = "" ; generate with: php -r "echo bin2hex(random_bytes(32));"
csrf_enabled = false ; Currently disabled for debugging, enable in production!
csrf_token_name = "csrf_token"
password_min_length = 6
password_require_special = false
password_require_numbers = false
password_require_uppercase = false
max_login_attempts = 5
lockout_duration = 900 ; 15 minutes in seconds

; Two-factor authentication (TOTP). Secure defaults: 2FA on and required for
; admins (level <= 50) and workbench users.
;   two_factor_enabled = false  -> disable 2FA entirely (dev convenience)
;   two_factor_enforce = false  -> OPTIONAL: eligible users are prompted at
;                                  login but may "Skip for now"; opted-in users
;                                  still verify. Users can enable it any time.
two_factor_enabled = true
two_factor_enforce = true

[uploads]
enabled = true
max_size = 5242880 ; 5MB in bytes
upload_path = "uploads/"
allowed_types = "image/jpeg,image/png,image/gif,application/pdf"
create_thumbnails = false
thumbnail_width = 200
thumbnail_height = 200

[cache]
enabled = false
driver = "file" ; file, redis, memcached
ttl = 3600 ; 1 hour
path = "cache/"

; Redis Settings
redis_host = "127.0.0.1"
redis_port = 6379
redis_password = ""
redis_database = 0

[api]
enabled = false
rate_limit = true
rate_limit_requests = 100
rate_limit_window = 3600 ; 1 hour
require_auth = true
api_key_header = "X-API-Key"

[social]
; Google OAuth 2.0 Settings
; Create credentials at: https://console.cloud.google.com/apis/credentials
; Add authorized redirect URI: https://yourapp.com/auth/googlecallback
google_client_id = ""
google_client_secret = ""
google_redirect_uri = "http://localhost:8000/auth/googlecallback"

; Facebook OAuth Settings (not yet implemented)
facebook_app_id = ""
facebook_app_secret = ""
facebook_redirect_uri = ""

; GitHub OAuth Settings (not yet implemented)
github_client_id = ""
github_client_secret = ""
github_redirect_uri = ""

[features]
; Feature flags
registration_enabled = true
email_verification = false
two_factor_auth = false
remember_me = true
social_login = false
api_access = false
file_uploads = true

[maintenance]
enabled = false
message = "We are currently performing maintenance. Please check back soon."
allowed_ips = "127.0.0.1" ; Comma-separated list of IPs that can access during maintenance

; Firehose: ship uncaught errors to the control plane, which dedups by signature
; and (for a NEW error on a published, idle instance) auto-triages a fix workspace.
; Populated per instance at provision time. Leave ingest_url empty to disable.
[firehose]
report = true                 ; master switch for this instance
role = "live"                 ; "live" reports; task workspaces are stamped "workspace" (muted)
ingest_url = ""               ; e.g. https://tiknix.com/firehose/report — empty = off
api_key = ""                  ; shared secret the ingest endpoint validates
instance = ""                 ; instance tag, e.g. "bidsurge.tiknix" (else derived from baseurl)
[explorer]
; Architecture Explorer sidecar SSO. sso_secret must be identical in both the
; core config and the explorer.tiknix sidecar config. Leave url empty to disable
; the launch link. Generate a secret with: openssl rand -hex 32
sso_secret =
url =

[integrations]
; Inbound messaging from connected platforms (Telegram, Slack, Discord).
;
; How many distinct external handles ONE connection may accumulate. A public
; group is joinable by anyone, so "people who can post in a channel you
; connected" is not a bounded set. Rows are tiny — millions would be needed to
; trouble a disk — but a table that grows from the outside should have a visible
; number on it rather than one discovered during an incident. Reaching the cap
; is logged at ERROR; existing handles keep working.
max_identities_per_connection = 5000

; Inbound webhook deliveries accepted per connection per minute. Sessionless
; (APCu-backed), because a webhook carries no cookie. If APCu is unavailable the
; limiter fails OPEN and says so once — a limiter that became a brick wall would
; be a worse outage than the abuse it guards against.
inbound_per_minute = 120

; Days an UNLINKED handle that never posted may sit idle before
; Model_Externalidentity::purgeIdle() may remove it. Linked handles are never
; purged: they are part of an account's history.
purge_idle_days = 90

[mqtt]
; Live delivery — "there is something for you, come and get it". The broker is
; installed by capricorn (configure/install-mosquitto.sh); capricorn/docs/MQTT.md
; covers the listeners, the topic ACL and the account model.
;
; enabled = false means the UI falls back to its polling interval and nothing
; breaks. MQTT only ever makes delivery faster; polling remains the guarantee.
; Leave it off until the broker is actually reachable — an enabled-but-dead
; broker means every signed-in browser retries a WebSocket that cannot connect.
enabled = false

; Server-side publishing. These are the tnx-pub credentials the capricorn
; installer writes to the publisher ini under the mosquitto config directory.
host = "127.0.0.1"
port = 1883
username = "tnx-pub"
password = ""

; Where browsers connect. Same origin — nginx proxies this path to the broker's
; websockets listener on 9001, so it inherits the page's TLS and certificate.
ws_path = "/mqtt"

; Mints each member's broker password: HMAC(member id, this secret). Nothing is
; stored, so this and the broker's password file are two derivations of one
; secret rather than two copies of a value — and rotating this invalidates every
; credential at once. scripts/mqtt-sync-accounts.php builds the file from the
; same derivation, so the two cannot drift.
; openssl rand -hex 32
secret = ""

[pipeline]
; Shared bearer secret for POST /pipeline/trigger/<slug> (cron/webhook fires).
; The fake-cron tick reads this per-instance. openssl rand -hex 32
trigger_secret = ""

; ---------------------------------------------------------------------------
; Sidecar plugins (app\Sidecar\Registry). Each [sidecar.<name>] section registers
; one plugin, so ADDING A PLUGIN IS CONFIG, NOT CODE. A plugin is only offered
; when it has BOTH a url and an sso_secret, and only to members whose `feature`
; flag is on (see lib/Feature.php — keep the labels there identical to these).
;
; THE ORDER OF THESE SECTIONS IS THE ORDER OF THE LEFT NAV. Registry::all() walks
; parse_ini_file's sections in file order, so moving a section moves the nav item.
; They are sequenced by the order of operations a project goes through: you Build
; it, you Deploy it, and Data is what it runs on.
;
; sso_secret must be identical to the [sidecar] sso_secret in that plugin's own
; config. Generate with: openssl rand -hex 32
; ---------------------------------------------------------------------------

[sidecar.workbench]
url = ""                      ; e.g. https://workbench.tiknix.com — empty = not offered
sso_secret = ""
feature = workbench
label = "Builder"
icon = "bi-hammer"

[sidecar.publisher]
url = ""
sso_secret = ""
feature = publisher
label = "Deploy"
icon = "bi-rocket-takeoff"

[sidecar.pipelines]
url = ""
sso_secret = ""
feature = pipelines
label = "Data"
icon = "bi-diagram-2"

[sidecar.explorer]
url = ""
sso_secret = ""
feature = explorer
label = "Architecture Explorer"
icon = "bi-diagram-3"

[sidecar.shop]
url = ""
sso_secret = ""
feature = shop
label = "Store"
icon = "bi-bag"

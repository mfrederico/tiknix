; QuickBooks Online (Intuit) app credentials for the control-plane connector.
;
; Copy this to conf/quickbooks.ini (gitignored, control-plane ONLY — it is never
; shipped to a builder instance) and fill in from your Intuit developer app at
; https://developer.intuit.com → your app → Keys & credentials.
;
; The per-COMPANY tokens are obtained via OAuth and stored ENCRYPTED on the
; connection. They never live in this file, and never in an instance — instances
; reach QuickBooks through the MCP broker.
;
; REDIRECT URI — register this exact URL on the Intuit app, for every host that
; will connect:
;
;     https://<your-host>/connections/callback/quickbooks
;
; Intuit matches it character for character; a trailing slash is a different URI.
;
; SANDBOX vs PRODUCTION is chosen by the connection's environment, not here.
; Connecting with environment "development" or "staging" talks to
; sandbox-quickbooks.api.intuit.com; only "production" reaches live books. Intuit
; issues separate Development and Production keys — put the ones matching the
; books you intend to reach in this file.

[oauth]
client_id     = ""
client_secret = ""

; Scope requested at authorization. Accounting is the useful surface; add
; com.intuit.quickbooks.payment only if you also need the Payments API.
; openid/profile/email are deliberately NOT requested — they add a consent prompt
; for identity data this connector never reads.
scope = "com.intuit.quickbooks.accounting"
